name: Build Noura iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'app.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'assets/**'
      - '.github/workflows/build-ios-unsigned.yml'

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      NOURA_ENABLE_HEALTHKIT: '0'
      NOURA_ENABLE_ICLOUD: '0'
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Install CocoaPods dependencies
        run: npx pod-install ios

      - name: Build unsigned iPhone app
        id: xcodebuild
        shell: bash
        run: |
          set -uo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$WORKSPACE" ]; then
            echo "No .xcworkspace found in ios/"
            exit 1
          fi

          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"
          mkdir -p build

          set +e
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            -resultBundlePath "$PWD/build/Noura.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee "$PWD/build/xcodebuild.log"
          STATUS=${PIPESTATUS[0]}
          set -e

          echo "xcodebuild exit code: $STATUS"
          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "========== XCODE ERROR SUMMARY =========="
            grep -nE '(^|[[:space:]])(error:|fatal error:|BUILD FAILED|The following build commands failed)' "$PWD/build/xcodebuild.log" | tail -n 250 || true
            echo "========================================="
          fi
          exit "$STATUS"

      - name: Upload Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Noura-xcode-diagnostics
          path: |
            build/xcodebuild.log
            build/Noura.xcresult
          if-no-files-found: warn
          retention-days: 7

      - name: Package unsigned IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found after build"
            exit 1
          fi

          rm -rf Payload Noura-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry Noura-unsigned.ipa Payload
          ls -lh Noura-unsigned.ipa

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Noura-unsigned-ipa
          path: Noura-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
