name: Build Noura iOS IPA (HealthKit + iCloud)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      NOURA_ENABLE_HEALTHKIT: '1'
      NOURA_ENABLE_ICLOUD: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Install JavaScript dependencies
        run: npm install

      - name: Generate native iOS project with HealthKit and CloudKit
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Install CocoaPods dependencies
        run: npx pod-install

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$WORKSPACE" ]; then echo "No .xcworkspace found"; exit 1; fi
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build-full" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build-full/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then echo "No .app found"; exit 1; fi
          rm -rf Payload Noura-full-capabilities-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry Noura-full-capabilities-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noura-full-capabilities-unsigned-ipa
          path: Noura-full-capabilities-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
